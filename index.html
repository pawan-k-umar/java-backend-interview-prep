<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <link rel="manifest" href="manifest.webmanifest">
    <title>1000 Java Interview Questions</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --card: #fff;
            --text: #111827;
            --muted: #667085;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --soft: #eef2ff;
            --warn: #fffbeb
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif
        }

        .app {
            max-width: 820px;
            margin: auto;
            padding-bottom: 88px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(246, 247, 251, .95);
            backdrop-filter: blur(12px);
            padding: 14px 16px 10px;
            border-bottom: 1px solid var(--border)
        }

        .brand {
            font-weight: 850;
            font-size: 20px
        }

        .sub {
            color: var(--muted);
            font-size: 12px
        }

        .search {
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 14px;
            font-size: 15px;
            background: white
        }

        main {
            padding: 16px
        }

        .hero {
            background: #111827;
            color: #fff;
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 15px
        }

        .hero h1 {
            margin: 0 0 5px;
            font-size: 25px
        }

        .hero p {
            margin: 0;
            color: #d1d5db
        }

        .bar {
            height: 8px;
            background: #374151;
            border-radius: 99px;
            margin-top: 14px
        }

        .bar i {
            display: block;
            height: 100%;
            background: #a5b4fc;
            width: 0;
            border-radius: 99px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px
        }

        .tile,
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px
        }

        .tile {
            padding: 13px;
            cursor: pointer
        }

        .tile b {
            display: block
        }

        .tile span {
            font-size: 12px;
            color: var(--muted)
        }

        .controls {
            display: flex;
            gap: 7px;
            overflow: auto;
            margin: 14px 0
        }

        .chip,
        .btn {
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 999px;
            padding: 9px 12px;
            white-space: nowrap;
            cursor: pointer
        }

        .chip.active,
        .btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent)
        }

        .card {
            padding: 16px;
            margin: 10px 0
        }

        .tag {
            display: inline-block;
            background: var(--soft);
            color: #3730a3;
            border-radius: 99px;
            padding: 4px 9px;
            font-size: 11px;
            font-weight: 750
        }

        .q {
            font-size: 18px;
            font-weight: 780;
            margin: 10px 0
        }

        .answer {
            display: none
        }

        .answer.show {
            display: block
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .06em;
            font-weight: 800;
            color: var(--muted);
            margin-top: 13px
        }

        .follow {
            border-left: 3px solid var(--accent);
            padding-left: 11px;
            margin-top: 6px
        }

        .tricky {
            background: var(--warn);
            padding: 10px;
            border-radius: 11px;
            margin-top: 10px
        }

        .row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 10px
        }

        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            padding: 10px;
            display: flex;
            justify-content: center;
            gap: 7px;
            z-index: 20
        }

        .bottom button {
            flex: 1;
            max-width: 200px
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: var(--muted)
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: none;
            align-items: flex-end;
            z-index: 30
        }

        .modal.show {
            display: flex
        }

        .sheet {
            background: #fff;
            width: 100%;
            max-width: 820px;
            margin: auto;
            padding: 20px;
            border-radius: 22px 22px 0 0;
            max-height: 88vh;
            overflow: auto
        }

        .sheet input,
        .sheet textarea,
        .sheet select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 10px;
            border: 1px solid var(--border);
            border-radius: 11px;
            font: inherit
        }

        .sheet textarea {
            min-height: 100px
        }

        @media(min-width:700px) {
            main {
                padding: 24px
            }

            .grid {
                grid-template-columns: repeat(4, 1fr)
            }

            .modal {
                align-items: center
            }

            .sheet {
                border-radius: 22px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="brand">☕ 1000 Java Backend Interview Questions</div>
            <div class="sub">Speakable answers • follow-ups • tricky points • phone-first</div><input id="search"
                class="search" placeholder="Search HashMap, Kafka, @Transactional, Kubernetes...">
        </header>
        <main>
            <section class="hero">
                <h1>Interview Mode: ON</h1>
                <p>Answer aloud first. Then reveal the model answer and follow-up.</p>
                <div class="bar"><i id="bar"></i></div>
                <div id="prog" class="sub" style="color:#d1d5db;margin-top:7px">0 mastered</div>
            </section>
            <div class="grid" id="days"></div>
            <div class="controls" id="chips"></div>
            <div id="list"></div>
        </main>
    </div>
    <div class="bottom"><button class="btn primary" onclick="interview()">🎯 Interview</button><button class="btn"
            onclick="quick()">⚡ 5-Min</button><button class="btn" onclick="openAdd()">➕ Add Q</button></div>
    <div class="modal" id="modal">
        <div class="sheet">
            <h2>Add your own question</h2>
            <div class="sub">Add company-specific or interviewer-specific questions whenever you need.</div>
            <label>Category</label><select id="ac"></select><label>Question</label><input id="aq"
                placeholder="e.g. Explain your Kafka error-handling approach"><label>Interview answer</label><textarea
                id="aa"></textarea><label>Follow-up question</label><input id="af"><label>Follow-up
                answer</label><textarea id="afa"></textarea><label>Tricky point</label><textarea id="at"></textarea>
            <div class="row"><button class="btn primary" onclick="addQ()">Save Question</button><button class="btn"
                    onclick="closeAdd()">Cancel</button></div>
        </div>
    </div>
    <script>
        let DATA = [];
        let custom = JSON.parse(localStorage.getItem('customQuestions') || '[]');
        let mastered = JSON.parse(localStorage.getItem('mastered1000') || '[]');
        let filter = 'All';
        const DAYS = {
            "1": ["Core Java", "Collections", "Java 8 & Functional"],
            "2": ["Multithreading", "JVM & Memory", "Design Patterns"],
            "3": ["Spring Core", "Spring Boot", "Spring Transactions"],
            "4": ["REST APIs", "Security", "Testing"],
            "5": ["Microservices", "Kafka"],
            "6": ["AWS", "Kubernetes", "SQL/PostgreSQL", "MongoDB"],
            "7": ["System Design", "Scenario Based", "Leadership & Project"]
        };

        let all = () => DATA.concat(custom);
        const esc = s => String(s || '').replace(/[&<>"']/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'}[m]));
        function save() {localStorage.setItem('mastered1000', JSON.stringify(mastered)); progress()}
        function progress() {let n = mastered.length, total = all().length, p = Math.round(n / total * 100); bar.style.width = p + '%'; prog.textContent = `${n} / ${total} mastered (${p}%)`}
        function cats() {return [...new Set(all().map(x => x.category))]}
        function renderDays() {days.innerHTML = Object.entries(DAYS).map(([d, cs]) => `<div class="tile" onclick="setFilter('${cs[0]}')"><b>Day ${d}</b><span>${cs.join(' • ')}</span></div>`).join('')}
        function renderChips() {chips.innerHTML = ['All', ...cats()].map(c => `<button class="chip ${filter === c ? 'active' : ''}" onclick="setFilter('${esc(c)}')">${esc(c)}</button>`).join('')}
        function setFilter(c) {filter = c; renderChips(); render()}
        function render() {
            let term = search.value.toLowerCase(), arr = all().filter(x => (filter === 'All' || x.category === filter) && (!term || (x.question + x.answer + x.category + x.topic).toLowerCase().includes(term)));
            list.innerHTML = arr.length ? arr.map(card).join('') : `<div class="empty">No questions found.</div>`
        }
        function card(x) {
            let done = mastered.includes(x.id); return `<article class="card"><span class="tag">${esc(x.category)} • ${esc(x.topic)}</span><div class="q">${esc(x.question)}</div>
<div class="row"><button class="btn" onclick="toggle('${x.id}')">👀 Show Answer</button><button class="btn" onclick="mark('${x.id}')">${done ? '✓ Mastered' : '☆ Mastered'}</button></div>
<div class="answer" id="ans${x.id}"><div class="label">🗣️ Say this in interview</div><div>${esc(x.answer)}</div><div class="label">🔄 Follow-up</div><div class="follow"><b>${esc(x.followup)}</b><br>${esc(x.followupAnswer)}</div><div class="tricky"><b>⚠️ Tricky point:</b> ${esc(x.tricky)}</div></div></article>`
        }
        function toggle(id) {document.getElementById('ans' + id).classList.toggle('show')}
        function mark(id) {id = Number(id); mastered = mastered.includes(id) ? mastered.filter(x => x !== id) : mastered.concat(id); save(); render()}
        function interview() {let arr = all().filter(x => filter === 'All' || x.category === filter); if (!arr.length) return; let x = arr[Math.floor(Math.random() * arr.length)]; list.innerHTML = `<article class="card"><span class="tag">🎯 INTERVIEWER</span><div class="q">${esc(x.question)}</div><p class="sub">Speak your answer aloud before revealing.</p><div class="row"><button class="btn primary" onclick="reveal('${x.id}')">Reveal Answer</button><button class="btn" onclick="interview()">Next</button></div><div id="iv"></div></article>`}
        function reveal(id) {let x = all().find(y => y.id == id); iv.innerHTML = `<div class="answer show"><div class="label">🗣️ Strong answer</div><div>${esc(x.answer)}</div><div class="label">🔄 Follow-up</div><div class="follow"><b>${esc(x.followup)}</b><br>${esc(x.followupAnswer)}</div><div class="tricky"><b>⚠️ Tricky:</b> ${esc(x.tricky)}</div><div class="row"><button class="btn primary" onclick="mark('${x.id}');interview()">✓ I can answer</button><button class="btn" onclick="interview()">Next</button></div></div>`}
        function quick() {let arr = [...all()].sort(() => Math.random() - .5).slice(0, 5); list.innerHTML = `<article class="card"><span class="tag">⚡ 5-MINUTE REVISION</span><div class="q">Answer these five aloud.</div></article>` + arr.map(card).join(''); scrollTo({top: 0, behavior: 'smooth'})}
        function openAdd() {ac.innerHTML = cats().map(c => `<option>${esc(c)}</option>`).join(''); modal.classList.add('show')}
        function closeAdd() {modal.classList.remove('show')}
        function addQ() {let x = {id: Date.now(), category: ac.value, topic: 'My Question', question: aq.value.trim(), answer: aa.value.trim(), followup: af.value.trim(), followupAnswer: afa.value.trim(), tricky: at.value.trim()}; if (!x.question || !x.answer) return alert('Question and answer are required.'); custom.push(x); localStorage.setItem('customQuestions', JSON.stringify(custom)); closeAdd(); aq.value = aa.value = af.value = afa.value = at.value = ''; render(); progress()}
        search.addEventListener('input', render);

        fetch('./data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Unable to load data.json');
                }
                return response.json();
            })
            .then(data => {
                DATA = data;
                renderDays();
                renderChips();
                render();
                progress();
            })
            .catch(error => {
                console.error('Error loading questions:', error);
                list.innerHTML = '<div class="empty">Unable to load questions. Make sure data.json is in the same folder and open the app through a web server.</div>';
            });

        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</body>

</html>
